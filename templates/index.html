{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<div class="container">
  <div class="welcome-card">
    <h1>Welcome, {{ current_user.username }}!</h1>
    <p>Your file management dashboard is ready.</p>
    <a href="{{ url_for('downloads') }}" class="btn-primary">View Files & Downloads</a>
    <a href="{{ url_for('upload_file') }}" class="btn-secondary">Upload New File</a>
  </div>
</div>

<style>
  .container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 80vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #71b7e6, #9b59b6);
    color: #fff;
    text-align: center;
    padding: 1rem;
  }

  .welcome-card {
    background: rgba(255, 255, 255, 0.15);
    padding: 3rem 4rem;
    border-radius: 15px;
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    max-width: 450px;
  }

  .welcome-card h1 {
    font-size: 2.8rem;
    margin-bottom: 0.5rem;
  }

  .welcome-card p {
    font-size: 1.2rem;
    margin-bottom: 2rem;
    opacity: 0.9;
  }

  .btn-primary, .btn-secondary {
    display: inline-block;
    margin: 0.5rem 1rem;
    padding: 0.8rem 2.2rem;
    border-radius: 40px;
    font-size: 1.1rem;
    font-weight: 600;
    text-decoration: none;
    transition: 0.3s ease;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }

  .btn-primary {
    background-color: #4CAF50;
    color: white;
    border: none;
  }

  .btn-primary:hover {
    background-color: #45a049;
    box-shadow: 0 7px 20px rgba(69, 160, 73, 0.7);
  }

  .btn-secondary {
    background-color: transparent;
    border: 2px solid white;
    color: white;
  }

  .btn-secondary:hover {
    background-color: white;
    color: #9b59b6;
    border-color: #9b59b6;
  }

  @media (max-width: 500px) {
    .welcome-card {
      padding: 2rem 2.5rem;
      max-width: 90%;
    }

    .welcome-card h1 {
      font-size: 2rem;
    }

    .btn-primary, .btn-secondary {
      padding: 0.7rem 1.6rem;
      font-size: 1rem;
      margin: 0.5rem 0.5rem;
    }
  }
</style>
{% endblock %}
